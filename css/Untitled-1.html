<!DOCTYPE html>
<html>
<head>
  <title>Inline JS Array</title>
</head>
<body>
  <h2>JavaScript Array Example</h2>

  <script>
    // inline JS array
    let fruits = ["Apple", "Banana", "Mango"];

    // show array in console
    console.log(fruits);

    // show first element on page
    document.write("First fruit: " + fruits[0]);
  </script>
</body>
</html>
